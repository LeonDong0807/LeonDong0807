name: Build admission portfolio PDF

on:
  push:
    paths:
      - 'admission_portfolio/generate_pdf.py'
      - '.github/workflows/build-admission-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install reportlab pillow requests
      - name: Generate PDF
        run: python admission_portfolio/generate_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admission_portfolio/Dong-You-Jyun-PCCU-Portfolio.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Build admission portfolio PDF'
            git push
          fi
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: admission-portfolio-pdf
          path: admission_portfolio/Dong-You-Jyun-PCCU-Portfolio.pdf
